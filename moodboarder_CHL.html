<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodboard Creator</title>
    <style>
        :root {
            --bg-color: #f5f5dc;
            --dot-color: #dcdcdc;
            --ui-bg: rgba(255, 255, 255, 0.95);
            --ui-shadow: 0 4px 15px rgba(0,0,0,0.1);
            --item-shadow: 0 4px 10px rgba(0,0,0,0.15);
            --video-bg: #000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }

        /* --- Toolbar --- */
        #toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            box-shadow: var(--ui-shadow);
            z-index: 10000;
            align-items: center;
        }

        button {
            border: none;
            background: #eee;
            color: #333;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        button.primary {
            background: #333;
            color: #fff;
        }

        button.primary:hover {
            background: #000;
        }

        /* --- Board Area --- */
        #board-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: auto;
        }

        #board {
            width: 3000px;
            height: 3000px;
            position: relative;
            transform-origin: 0 0;
        }

        /* --- Board Items --- */
        .board-item {
            position: absolute;
            cursor: grab;
            display: inline-block;
            transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: var(--item-shadow);
            border: 4px solid transparent;
            border-radius: 4px;
            z-index: 1;
            background: white;
            touch-action: none;
        }

        .board-item:active {
            cursor: grabbing;
        }

        .board-item.selected {
            box-shadow: 0 0 0 2px #333;
            z-index: 1000 !important;
        }

        .board-item img, 
        .board-item video, 
        .board-item iframe {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: auto;
            border-radius: 2px;
        }

        .board-item video {
            background: var(--video-bg);
            object-fit: contain;
        }

        /* --- Video Drag Overlay (Top 80%) --- */
        .video-drag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px); /* Leave bottom 50px for controls */
            background: transparent;
            cursor: grab;
            z-index: 5; /* Above video */
        }
        .video-drag-overlay:active {
            cursor: grabbing;
        }

        /* --- Item Controls --- */
        .item-controls {
            position: absolute;
            top: -20px;
            right: -15px;
            display: flex;
            gap: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .board-item:hover .item-controls,
        .board-item.selected .item-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 24px;
            height: 24px;
            background: #333;
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .ctrl-btn.delete { background: #ff4d4d; }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, #333 50%);
            cursor: nwse-resize;
            display: none;
            z-index: 15;
        }

        .board-item:hover .resize-handle,
        .board-item.selected .resize-handle {
            display: block;
        }

        /* --- YouTube Thumbnail Styling --- */
        .yt-thumbnail-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .yt-thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .yt-play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .yt-thumbnail-container:hover .yt-play-overlay {
            background: rgba(0,0,0,0.1);
        }

        /* --- Inputs --- */
        input[type="file"] { display: none; }

        /* --- Note Card --- */
        .note-content {
            width: 100%;
            height: 100%;
            padding: 16px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            background: #fff;
            border-radius: 2px;
        }
        .note-header {
            font-weight: 700;
            line-height: 1.2;
            color: #1a1a1a;
            word-break: break-word;
            margin: 0;
        }
        .note-body {
            line-height: 1.55;
            color: #444;
            word-break: break-word;
            white-space: pre-wrap;
            margin: 0;
            flex: 1;
            overflow: hidden;
        }
        .note-body a {
            color: #1a6fc4;
            text-decoration: underline;
            cursor: pointer;
            pointer-events: auto;
        }
        .note-body a:hover { color: #0d4a8a; }

        /* --- Note link inserter toolbar --- */
        .note-body-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .note-body-toolbar button {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        .note-body-toolbar button:hover { background: #e0e0e0; transform: none; }
        #link-inserter {
            display: none;
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            gap: 8px;
            flex-direction: column;
        }
        #link-inserter.open { display: flex; }
        .link-inserter-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .link-inserter-row label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            width: 32px;
            flex-shrink: 0;
            text-transform: uppercase;
            margin: 0;
        }
        .link-inserter-row input {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 0;
            user-select: text;
        }
        .link-inserter-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 2px;
        }
        .link-inserter-actions button {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        /* --- Modal --- */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        #modal {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #modal input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        #modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }

        /* --- Note Modal --- */
        #note-modal {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 440px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #note-modal h3 { margin-top: 0; margin-bottom: 16px; }
        #note-modal label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        #note-modal input[type="text"],
        #note-modal textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 14px;
            resize: vertical;
            user-select: text;
        }
        #note-modal textarea { min-height: 90px; }
        .note-size-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .note-size-row > div { flex: 1; }
        .size-btn-group {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .size-btn-group button {
            flex: 1;
            padding: 7px 6px;
            border-radius: 6px;
            font-size: 13px;
            background: #eee;
            color: #333;
            border: 2px solid transparent;
            transition: all 0.15s;
        }
        .size-btn-group button.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        .size-btn-group button:hover:not(.active) { background: #ddd; transform: none; }

        /* --- Missing Media Placeholder --- */
        .missing-media {
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 12px;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
            gap: 6px;
            border-radius: 2px;
        }
        .missing-media .mi-icon { font-size: 28px; }
        .missing-media .mi-name { word-break: break-all; font-weight: 600; color: #888; font-size: 11px; }
        .missing-media .mi-hint { color: #bbb; font-size: 10px; }

        /* --- Relink button (in toolbar, shown when needed) --- */
        #relink-btn { background: #e67e22; color: #fff; display: none; }
        #relink-btn:hover { background: #d35400; }
        #video-ctx-menu {
            position: fixed;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            padding: 6px 0;
            min-width: 170px;
            z-index: 50000;
            display: none;
            font-size: 14px;
        }
        .ctx-item {
            padding: 9px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #222;
            transition: background 0.1s;
        }
        .ctx-item:hover { background: #f0f0f0; }
        .ctx-item .ctx-icon { font-size: 15px; width: 18px; text-align: center; }
        .ctx-item .ctx-badge {
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            background: #333;
            color: #fff;
            padding: 2px 7px;
            border-radius: 20px;
        }

        /* --- Toast --- */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 30000;
        }
    </style>
</head>
<body>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="toolbar">
        <button onclick="triggerFile('image/*')">+ Photos</button>
        <button onclick="triggerFile('video/*')">+ Videos</button>
        <button onclick="openYTModal()">+ YouTube</button>
        <button onclick="openNoteModal()">+ Note</button>
        <div style="width:1px; height:20px; background:#ccc; margin:0 5px;"></div>
        <button onclick="rearrangeBoard()">✨ Rearrange</button>
        <button onclick="clearBoard()" style="color:#d32f2f;">Clear</button>
        <div style="width:1px; height:20px; background:#ccc; margin:0 5px;"></div>
        <button onclick="saveProject()" title="Save editable project file">💾 Save Project</button>
        <button onclick="document.getElementById('projectInput').click()" title="Load a saved project">📂 Load Project</button>
        <button id="relink-btn" onclick="document.getElementById('relinkInput').click()" title="Re-link missing local files">📎 Re-link Files</button>
        <button class="primary" onclick="saveBoard()">Export HTML</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple>
    <input type="file" id="videoInput" accept="video/*" multiple>
    <input type="file" id="projectInput" accept=".moodboard,.json">
    <input type="file" id="relinkInput" accept="image/*,video/*" multiple>

    <div id="modal-overlay">
        <div id="modal">
            <h3 style="margin-top:0;">Add YouTube Video</h3>
            <p style="font-size:13px; color:#666;">Paste a YouTube link</p>
            <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=...">
            <div id="modal-buttons">
                <button onclick="closeYTModal()">Cancel</button>
                <button class="primary" onclick="confirmYT()">Add</button>
            </div>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:20000;">
        <div id="note-modal">
            <h3>Add Text Note</h3>
            <label for="note-header-input">Header</label>
            <input type="text" id="note-header-input" placeholder="e.g. Mood, Colour palette…">
            <label for="note-body-input">Body text</label>
            <div class="note-body-toolbar">
                <button onclick="toggleLinkInserter()" title="Insert a hyperlink">🔗 Insert Link</button>
                <span style="font-size:11px;color:#aaa;">or type [text](https://url.com)</span>
            </div>
            <div id="link-inserter">
                <div class="link-inserter-row">
                    <label>Text</label>
                    <input type="text" id="link-text-input" placeholder="e.g. Visit our website">
                </div>
                <div class="link-inserter-row">
                    <label>URL</label>
                    <input type="text" id="link-url-input" placeholder="https://example.com">
                </div>
                <div class="link-inserter-actions">
                    <button onclick="toggleLinkInserter()">Cancel</button>
                    <button class="primary" onclick="insertLinkIntoBody()">Insert</button>
                </div>
            </div>
            <textarea id="note-body-input" placeholder="Write your notes here…"></textarea>
            <div class="note-size-row">
                <div>
                    <label>Header size</label>
                    <div class="size-btn-group" id="header-size-btns">
                        <button onclick="setSize('header','18px')" data-size="18px">S</button>
                        <button onclick="setSize('header','24px')" data-size="24px" class="active">M</button>
                        <button onclick="setSize('header','32px')" data-size="32px">L</button>
                    </div>
                </div>
                <div>
                    <label>Body size</label>
                    <div class="size-btn-group" id="body-size-btns">
                        <button onclick="setSize('body','12px')" data-size="12px">S</button>
                        <button onclick="setSize('body','15px')" data-size="15px" class="active">M</button>
                        <button onclick="setSize('body','20px')" data-size="20px">L</button>
                    </div>
                </div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;">
                <button onclick="closeNoteModal()">Cancel</button>
                <button class="primary" onclick="confirmNote()">Add Note</button>
            </div>
        </div>
    </div>

    <!-- Video right-click context menu -->
    <div id="video-ctx-menu">
        <div class="ctx-item" id="ctx-loop-btn" onclick="toggleVideoLoop()">
            <span class="ctx-icon">🔁</span>
            <span>Loop video</span>
            <span class="ctx-badge" id="ctx-loop-badge" style="display:none">ON</span>
        </div>
    </div>

    <div id="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:30000;">Message</div>

    <script>
        // --- State ---
        const board = document.getElementById('board');
        const fileInput = document.getElementById('fileInput');
        const videoInput = document.getElementById('videoInput');
        const ytModal = document.getElementById('modal-overlay');
        const ytInput = document.getElementById('yt-url');
        const toastEl = document.getElementById('toast');
        
        let items = []; 
        let dragItem = null;
        let resizeItem = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startWidth = 0;
        let startHeight = 0;
        let startX, startY;
        let hasMoved = false;
        let clickedYTContainer = null;
        let zIndexCounter = 10;
        const SNAP_THRESHOLD = 20;

        // Media source store — keeps large data URLs out of DOM attributes (no size limit)
        const mediaSources = new Map(); // itemId → { src, fileName }
        let itemIdCounter = 0;

        // ── IndexedDB: persist FileSystemFileHandle objects across sessions ──
        // FileSystemFileHandle can't go in JSON but CAN go in IndexedDB.
        // We store { itemId, handle, fileName } so we can silently re-open
        // the same file next time the project is loaded.
        const HANDLES_DB = 'moodboard-file-handles';

        function _openHandlesDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(HANDLES_DB, 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('handles', { keyPath: 'itemId' });
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function dbPutHandle(itemId, handle, fileName) {
            try { const db = await _openHandlesDB(); const tx = db.transaction('handles','readwrite'); tx.objectStore('handles').put({ itemId, handle, fileName }); } catch(e) {}
        }
        async function dbGetHandle(itemId) {
            try { const db = await _openHandlesDB(); return await new Promise(res => { const tx = db.transaction('handles','readonly'); const r = tx.objectStore('handles').get(itemId); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch(e) { return null; }
        }
        async function dbDeleteHandle(itemId) {
            try { const db = await _openHandlesDB(); const tx = db.transaction('handles','readwrite'); tx.objectStore('handles').delete(itemId); } catch(e) {}
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Note modal state
        let noteHeaderSize = '24px';
        let noteBodySize = '15px';
        let editingNoteEl = null;

        // Video context menu state
        let ctxTargetVideo = null;
        const videoCtxMenu = document.getElementById('video-ctx-menu');

        function showVideoCtxMenu(e, videoEl) {
            e.preventDefault();
            ctxTargetVideo = videoEl;
            document.getElementById('ctx-loop-badge').style.display = videoEl.loop ? 'inline-block' : 'none';
            videoCtxMenu.style.display = 'block';
            // Position near cursor, keep within viewport
            const x = Math.min(e.clientX, window.innerWidth - 190);
            const y = Math.min(e.clientY, window.innerHeight - 60);
            videoCtxMenu.style.left = x + 'px';
            videoCtxMenu.style.top = y + 'px';
        }

        function toggleVideoLoop() {
            if (!ctxTargetVideo) return;
            ctxTargetVideo.loop = !ctxTargetVideo.loop;
            document.getElementById('ctx-loop-badge').style.display = ctxTargetVideo.loop ? 'inline-block' : 'none';
            showToast(ctxTargetVideo.loop ? 'Loop enabled' : 'Loop disabled');
            videoCtxMenu.style.display = 'none';
        }

        // Close context menu on any click elsewhere
        document.addEventListener('click', () => { videoCtxMenu.style.display = 'none'; });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') videoCtxMenu.style.display = 'none'; });

        // --- File Handling ---
        // Use showOpenFilePicker (Chrome/Edge) to get persistent FileSystemFileHandle.
        // Falls back to <input type="file"> on Firefox/Safari.
        const HAS_PICKER = 'showOpenFilePicker' in window;

        async function triggerFile(mediaType) {
            if (HAS_PICKER) {
                const isImage = mediaType.startsWith('image');
                const opts = {
                    multiple: true,
                    types: isImage
                        ? [{ description: 'Images', accept: { 'image/*': ['.png','.jpg','.jpeg','.gif','.webp','.avif','.svg'] } }]
                        : [{ description: 'Videos', accept: { 'video/*': ['.mp4','.webm','.mov','.mkv','.avi','.m4v'] } }]
                };
                try {
                    const handles = await window.showOpenFilePicker(opts);
                    for (const handle of handles) {
                        const file = await handle.getFile();
                        const itemId = 'item-' + (itemIdCounter++);
                        await dbPutHandle(itemId, handle, file.name);
                        const src = await readFileAsDataURL(file);
                        createBoardItem(isImage ? 'image' : 'video', src, file.name, itemId);
                    }
                } catch(e) {
                    if (e.name !== 'AbortError') {
                        // Unexpected error — fall back to input
                        if (mediaType.startsWith('image')) fileInput.click(); else videoInput.click();
                    }
                }
            } else {
                if (mediaType.startsWith('image')) fileInput.click(); else videoInput.click();
            }
        }

        // Fallback listeners for browsers without File System Access API
        fileInput.addEventListener('change', (e) => handleFilesFallback(e.target.files, 'image'));
        videoInput.addEventListener('change', (e) => handleFilesFallback(e.target.files, 'video'));

        function handleFilesFallback(files, type) {
            if (!files.length) return;
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    setTimeout(() => {
                        const itemId = 'item-' + (itemIdCounter++);
                        // No handle available in fallback path — manual re-link required
                        createBoardItem(type, e.target.result, file.name, itemId);
                    }, index * 50);
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = ''; videoInput.value = '';
        }

        // --- YouTube ---
        function openYTModal() { ytModal.style.display = 'flex'; ytInput.focus(); }
        function closeYTModal() { ytModal.style.display = 'none'; ytInput.value = ''; }
        function confirmYT() {
            const id = extractYTId(ytInput.value.trim());
            if (id) {
                createBoardItem('youtube', id);
                closeYTModal();
                showToast('YouTube video added');
            } else alert('Invalid YouTube URL');
        }
        function extractYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // --- Note Modal ---
        function openNoteModal(noteEl) {
            editingNoteEl = noteEl || null;
            const overlay = document.getElementById('note-modal-overlay');
            if (noteEl) {
                // Pre-fill for editing
                document.getElementById('note-header-input').value = noteEl.querySelector('.note-header').textContent;
                document.getElementById('note-body-input').value = noteEl.querySelector('.note-body').textContent;
                noteHeaderSize = noteEl.querySelector('.note-header').style.fontSize || '24px';
                noteBodySize = noteEl.querySelector('.note-body').style.fontSize || '15px';
                document.querySelector('#note-modal .primary').textContent = 'Update Note';
            } else {
                document.getElementById('note-header-input').value = '';
                document.getElementById('note-body-input').value = '';
                noteHeaderSize = '24px';
                noteBodySize = '15px';
                document.querySelector('#note-modal .primary').textContent = 'Add Note';
            }
            // Sync active buttons
            syncSizeBtns('header', noteHeaderSize);
            syncSizeBtns('body', noteBodySize);
            overlay.style.display = 'flex';
            document.getElementById('note-header-input').focus();
        }

        function closeNoteModal() {
            document.getElementById('note-modal-overlay').style.display = 'none';
            document.getElementById('link-inserter').classList.remove('open');
            editingNoteEl = null;
        }

        function setSize(type, size) {
            if (type === 'header') noteHeaderSize = size;
            else noteBodySize = size;
            syncSizeBtns(type, size);
        }

        function syncSizeBtns(type, size) {
            const group = document.getElementById(type + '-size-btns');
            group.querySelectorAll('button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === size);
            });
        }

        // --- Note Link Helpers ---
        // Parses [text](url) and bare https?:// URLs into safe <a> tags (http/https only)
        function parseNoteBody(raw) {
            // Step 1: escape HTML entities in raw text
            let escaped = raw
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            // Step 2: replace [text](url) — only allow http/https
            escaped = escaped.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                (_, text, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" onmousedown="event.stopPropagation()">${text}</a>`
            );

            // Step 3: replace bare URLs not already inside an href=""
            // Use a lookbehind to avoid double-linking
            escaped = escaped.replace(
                /(?<!href=")(https?:\/\/[^\s<"]+)/g,
                url => `<a href="${url}" target="_blank" rel="noopener noreferrer" onmousedown="event.stopPropagation()">${url}</a>`
            );

            return escaped;
        }

        // Same parser for export (identical output, no inline event handlers needed for static HTML)
        function parseNoteBodyForExport(raw) {
            let escaped = raw
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
            escaped = escaped.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                (_, text, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`
            );
            escaped = escaped.replace(
                /(?<!href=")(https?:\/\/[^\s<"]+)/g,
                url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
            );
            return escaped;
        }

        function toggleLinkInserter() {
            const el = document.getElementById('link-inserter');
            const isOpen = el.classList.toggle('open');
            if (isOpen) {
                // Pre-fill link text from textarea selection
                const ta = document.getElementById('note-body-input');
                const sel = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
                document.getElementById('link-text-input').value = sel;
                document.getElementById('link-url-input').value = '';
                document.getElementById(sel ? 'link-url-input' : 'link-text-input').focus();
            }
        }

        function insertLinkIntoBody() {
            const text = document.getElementById('link-text-input').value.trim();
            const url = document.getElementById('link-url-input').value.trim();
            if (!text || !url) { alert('Please fill in both the link text and URL.'); return; }
            if (!/^https?:\/\//i.test(url)) { alert('URL must start with https:// or http://'); return; }

            const ta = document.getElementById('note-body-input');
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const markdown = `[${text}](${url})`;
            ta.value = ta.value.substring(0, start) + markdown + ta.value.substring(end);
            // Move cursor to after inserted link
            ta.selectionStart = ta.selectionEnd = start + markdown.length;
            ta.focus();
            toggleLinkInserter();
        }

        function confirmNote() {
            const header = document.getElementById('note-header-input').value.trim();
            const body = document.getElementById('note-body-input').value.trim();
            if (!header && !body) { alert('Please add a header or some text.'); return; }

            if (editingNoteEl) {
                // Update existing note
                editingNoteEl.querySelector('.note-header').textContent = header;
                editingNoteEl.querySelector('.note-header').style.fontSize = noteHeaderSize;
                editingNoteEl.querySelector('.note-header').style.display = header ? 'block' : 'none';
                editingNoteEl.querySelector('.note-body').innerHTML = parseNoteBody(body);
                editingNoteEl.querySelector('.note-body').style.fontSize = noteBodySize;
                editingNoteEl.querySelector('.note-body').style.display = body ? 'block' : 'none';
                // Keep dataset in sync (store raw text, not HTML)
                editingNoteEl.dataset.noteHeader = header;
                editingNoteEl.dataset.noteBody = body;
                editingNoteEl.dataset.noteHeaderSize = noteHeaderSize;
                editingNoteEl.dataset.noteBodySize = noteBodySize;
            } else {
                createNoteItem(header, body, noteHeaderSize, noteBodySize);
                showToast('Note added');
            }
            // Reset link inserter
            document.getElementById('link-inserter').classList.remove('open');
            closeNoteModal();
        }

        // --- Load Youtube Iframe Logic ---
        function loadYT(container, id) {
            // Check if iframe already exists
            if (container.querySelector('iframe')) return;

            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=1`;
            iframe.frameBorder = "0";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.pointerEvents = 'auto'; // Ensure iframe is clickable

            // Clear container
            while(container.firstChild) container.removeChild(container.firstChild);
            container.appendChild(iframe);
        }

        // --- Item Creation ---
        function createBoardItem(type, src, fileName, preassignedId) {
            const el = document.createElement('div');
            el.classList.add('board-item');
            
            const bc = document.getElementById('board-container');
            const spawnX = bc.scrollLeft + 20 + Math.random() * 60;
            const spawnY = bc.scrollTop + 20 + Math.random() * 60;
            el.style.left = `${spawnX}px`;
            el.style.top = `${spawnY}px`;
            el.style.zIndex = zIndexCounter++;

            let content;
            
            if (type === 'image') {
                content = document.createElement('img');
                content.src = src;
                const itemId = preassignedId || 'item-' + (itemIdCounter++);
                el.dataset.itemId = itemId;
                el.dataset.itemType = 'image';
                mediaSources.set(itemId, { src, fileName: fileName || null });
                content.onload = function() {
                    const ratio = this.naturalWidth / this.naturalHeight;
                    let w = 300; let h = 300 / ratio;
                    if (h > 300) { h = 300; w = 300 * ratio; }
                    el.style.width = w + 'px';
                    el.style.height = h + 'px';
                    el.dataset.aspect = ratio;
                }
            } else if (type === 'video') {
                content = document.createElement('video');
                content.src = src;
                content.controls = true;
                content.loop = false;
                content.muted = false;
                const itemId = preassignedId || 'item-' + (itemIdCounter++);
                el.dataset.itemId = itemId;
                el.dataset.itemType = 'video';
                mediaSources.set(itemId, { src, fileName: fileName || null });
                el.style.width = '320px'; 
                el.style.height = 'auto';
                el.dataset.aspect = 16/9;
                content.onloadedmetadata = function() {
                    el.dataset.aspect = this.videoWidth / this.videoHeight;
                    el.style.height = el.offsetWidth / el.dataset.aspect + 'px';
                }
                // Right-click to toggle loop
                content.addEventListener('contextmenu', (e) => showVideoCtxMenu(e, content));
                
                // Add Overlay for dragging
                const overlay = document.createElement('div');
                overlay.className = 'video-drag-overlay';
                // Right-click on overlay also triggers loop menu
                overlay.addEventListener('contextmenu', (e) => showVideoCtxMenu(e, content));
                el.appendChild(overlay); 
                
            } else if (type === 'youtube') {
                content = document.createElement('div');
                content.className = 'yt-thumbnail-container';
                content.dataset.ytid = src;
                el.dataset.itemId = 'item-' + (itemIdCounter++);
                el.dataset.itemType = 'youtube';
                el.dataset.ytid = src;
                
                const img = document.createElement('img');
                img.src = `https://img.youtube.com/vi/${src}/hqdefault.jpg`;
                
                const overlay = document.createElement('div');
                overlay.className = 'yt-play-overlay';
                
                content.appendChild(img);
                content.appendChild(overlay);

                el.style.width = '320px';
                el.style.height = '180px';
                el.dataset.aspect = 16/9;
            }

            if (type !== 'youtube') el.appendChild(content);
            else el.appendChild(content);

            // Controls
            const controls = document.createElement('div');
            controls.className = 'item-controls';
            
            const delBtn = document.createElement('div');
            delBtn.className = 'ctrl-btn delete';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = (e) => { e.stopPropagation(); removeItem(el); };
            controls.appendChild(delBtn);
            el.appendChild(controls);

            // Resize Handle
            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            el.appendChild(resizeHandle);

            // Events
            el.addEventListener('mousedown', onMouseDown);
            resizeHandle.addEventListener('mousedown', onResizeStart);
            el.addEventListener('touchstart', onTouchStart, {passive: false});

            board.appendChild(el);
            items.push(el);
            selectItem(el);
        }

        // --- Note Item Creation ---
        function createNoteItem(header, body, headerSize, bodySize) {
            const el = document.createElement('div');
            el.classList.add('board-item');
            el.dataset.freeResize = 'true'; // Free-resize mode (no aspect lock)

            const bc = document.getElementById('board-container');
            const cx = bc.scrollLeft + 20 + Math.random() * 60;
            const cy = bc.scrollTop + 20 + Math.random() * 60;
            el.style.left = `${cx}px`;
            el.style.top = `${cy}px`;
            el.style.width = '260px';
            el.style.height = 'auto';
            el.style.minHeight = '100px';
            el.style.zIndex = zIndexCounter++;

            el.dataset.itemType = 'note';
            el.dataset.noteHeader = header;
            el.dataset.noteBody = body;
            el.dataset.noteHeaderSize = headerSize;
            el.dataset.noteBodySize = bodySize;

            const noteDiv = document.createElement('div');
            noteDiv.className = 'note-content';

            const h = document.createElement('p');
            h.className = 'note-header';
            h.textContent = header;
            h.style.fontSize = headerSize;
            h.style.display = header ? 'block' : 'none';

            const b = document.createElement('p');
            b.className = 'note-body';
            b.innerHTML = parseNoteBody(body);
            b.style.fontSize = bodySize;
            b.style.display = body ? 'block' : 'none';

            noteDiv.appendChild(h);
            noteDiv.appendChild(b);
            el.appendChild(noteDiv);

            // Edit button in controls
            const controls = document.createElement('div');
            controls.className = 'item-controls';

            const editBtn = document.createElement('div');
            editBtn.className = 'ctrl-btn';
            editBtn.innerHTML = '✏️';
            editBtn.style.fontSize = '12px';
            editBtn.title = 'Edit note';
            editBtn.onclick = (e) => { e.stopPropagation(); openNoteModal(el); };
            controls.appendChild(editBtn);

            const delBtn = document.createElement('div');
            delBtn.className = 'ctrl-btn delete';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = (e) => { e.stopPropagation(); removeItem(el); };
            controls.appendChild(delBtn);
            el.appendChild(controls);

            // Resize Handle (free both axes)
            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            el.appendChild(resizeHandle);

            // Double-click to edit
            el.addEventListener('dblclick', (e) => {
                if (e.target.closest('a') || e.target.closest('.item-controls')) return;
                openNoteModal(el);
            });

            el.addEventListener('mousedown', onMouseDown);
            resizeHandle.addEventListener('mousedown', onResizeStart);
            el.addEventListener('touchstart', onTouchStart, {passive: false});

            board.appendChild(el);
            items.push(el);
            selectItem(el);
        }

        function removeItem(el) {
            const itemId = el.dataset.itemId;
            mediaSources.delete(itemId);
            if (itemId) dbDeleteHandle(itemId);
            el.remove();
            items = items.filter(i => i !== el);
        }

        function clearBoard() {
            if(confirm("Clear the entire moodboard?")) {
                items.forEach(el => { if (el.dataset.itemId) dbDeleteHandle(el.dataset.itemId); });
                board.innerHTML = '';
                items = [];
                mediaSources.clear();
            }
        }

        // --- Robust Drag Logic ---
        function onMouseDown(e) {
            if (e.target.classList.contains('delete-btn') || e.target.classList.contains('resize-handle') || e.target.closest('.item-controls')) return;
            // Let hyperlinks in notes be clicked normally
            if (e.target.closest('a')) return;

            dragItem = e.currentTarget;
            selectItem(dragItem);

            // --- Check for YouTube Click ---
            clickedYTContainer = e.target.closest('.yt-thumbnail-container');

            // --- Video Control Protection ---
            // If target is video and click is near bottom, do NOT drag.
            if (e.target.tagName === 'VIDEO') {
                const rect = e.target.getBoundingClientRect();
                const clickYFromBottom = rect.height - (e.clientY - rect.top);
                if (clickYFromBottom < 50) {
                    dragItem = null;
                    clickedYTContainer = null; // Not a drag event
                    return;
                }
            }

            // Record initial state for "Click vs Drag" detection
            startX = e.clientX;
            startY = e.clientY;
            hasMoved = false;

            // Prevent default for text selection/ghosting
            // Note: This blocks native 'click' events, so we handle YT click manually in MouseUp
            e.preventDefault();

            dragOffsetX = e.clientX - dragItem.getBoundingClientRect().left;
            dragOffsetY = e.clientY - dragItem.getBoundingClientRect().top;

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function onMouseMove(e) {
            if (!dragItem) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (!hasMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                hasMoved = true;
                dragItem.style.transition = 'none';
            }

            if (hasMoved) {
                const containerRect = document.getElementById('board-container').getBoundingClientRect();
                const scrollLeft = document.getElementById('board-container').scrollLeft;
                const scrollTop = document.getElementById('board-container').scrollTop;

                let newX = (e.clientX - containerRect.left) + scrollLeft - dragOffsetX;
                let newY = (e.clientY - containerRect.top) + scrollTop - dragOffsetY;

                dragItem.style.left = `${newX}px`;
                dragItem.style.top = `${newY}px`;
            }
        }

        function onMouseUp(e) {
            if (dragItem) {
                dragItem.style.transition = 'box-shadow 0.2s, transform 0.2s';
                
                // If we didn't move (it was a click)
                if (!hasMoved) {
                    if (clickedYTContainer) {
                        // It was a click on a YouTube thumbnail
                        const videoId = clickedYTContainer.dataset.ytid;
                        if (videoId) {
                            loadYT(clickedYTContainer, videoId);
                        }
                    }
                    // If it was a click on a regular item, we just let it be selected (done in mousedown)
                } else {
                    // It was a drag
                    snapToNearby(dragItem);
                }

                dragItem = null;
                clickedYTContainer = null;
            }
            if (resizeItem) {
                resizeItem.style.transition = 'box-shadow 0.2s, transform 0.2s';
                resizeItem = null;
            }
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.removeEventListener('mousemove', onResizeMove);
        }

        // --- Resize Logic ---
        function onResizeStart(e) {
            e.stopPropagation(); 
            e.preventDefault();
            resizeItem = e.currentTarget.parentElement; 
            selectItem(resizeItem);
            resizeItem.style.transition = 'none';
            startWidth = parseFloat(resizeItem.style.width);
            startHeight = parseFloat(resizeItem.offsetHeight); // use offsetHeight for auto-height notes
            dragOffsetX = e.clientX - startWidth;
            dragOffsetY = e.clientY - startHeight; // for free-resize
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function onResizeMove(e) {
            if (!resizeItem) return;
            const newWidth = e.clientX - dragOffsetX;
            if (resizeItem.dataset.freeResize) {
                // Free resize for notes — both axes independently
                const newHeight = e.clientY - dragOffsetY;
                if (newWidth > 120) resizeItem.style.width = newWidth + 'px';
                if (newHeight > 60) resizeItem.style.height = newHeight + 'px';
            } else {
                if (newWidth > 50) {
                    const aspect = parseFloat(resizeItem.dataset.aspect) || 1;
                    resizeItem.style.width = newWidth + 'px';
                    resizeItem.style.height = (newWidth / aspect) + 'px';
                    
                    // If video, update overlay height
                    const overlay = resizeItem.querySelector('.video-drag-overlay');
                    if (overlay) {
                        overlay.style.height = `calc(100% - 50px)`;
                    }
                }
            }
        }

        // --- Touch Support ---
        function onTouchStart(e) {
            if (e.target.classList.contains('delete-btn') || e.target.classList.contains('resize-handle')) return;
            e.preventDefault(); 
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX, clientY: touch.clientY, currentTarget: e.currentTarget
            });
            e.currentTarget.dispatchEvent(mouseEvent);
        }
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if(dragItem) onMouseMove({clientX: touch.clientX, clientY: touch.clientY});
        }, {passive: false});
        document.addEventListener('touchend', () => onMouseUp());

        // --- Snap & Selection ---
        function snapToNearby(el) {
            const x1 = parseFloat(el.style.left);
            const y1 = parseFloat(el.style.top);
            const w1 = parseFloat(el.style.width);
            const h1 = parseFloat(el.style.height);

            items.forEach(other => {
                if (other === el) return;
                const x2 = parseFloat(other.style.left);
                const y2 = parseFloat(other.style.top);
                const w2 = parseFloat(other.style.width);
                const h2 = parseFloat(other.style.height);

                if (Math.abs(x1 - x2) < SNAP_THRESHOLD) el.style.left = x2 + 'px';
                else if (Math.abs(x1 - (x2 + w2)) < SNAP_THRESHOLD) el.style.left = (x2 + w2) + 'px';
                else if (Math.abs((x1 + w1) - x2) < SNAP_THRESHOLD) el.style.left = (x2 - w1) + 'px';

                if (Math.abs(y1 - y2) < SNAP_THRESHOLD) el.style.top = y2 + 'px';
                else if (Math.abs(y1 - (y2 + h2)) < SNAP_THRESHOLD) el.style.top = (y2 + h2) + 'px';
                else if (Math.abs((y1 + h1) - y2) < SNAP_THRESHOLD) el.style.top = (y2 - h1) + 'px';
            });
        }

        function selectItem(el) {
            items.forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            el.style.zIndex = zIndexCounter++;
        }

        document.getElementById('board-container').addEventListener('mousedown', (e) => {
            if (e.target.id === 'board-container' || e.target.id === 'board') {
                items.forEach(i => i.classList.remove('selected'));
            }
        });

        // --- Non-Destructive Rearrange (Shelf Packing) ---
        function rearrangeBoard() {
            if (items.length === 0) return;
            showToast('Arranging items...');

            const container = document.getElementById('board-container');
            const containerWidth = container.clientWidth;
            const gap = 20;
            const padding = 20;

            // Add transitions
            items.forEach(item => {
                item.style.transition = 'top 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
            });

            let currentX = padding;
            let currentY = padding;
            let rowHeight = 0;

            items.forEach(item => {
                // Use rendered dimensions so auto-height notes and loaded images work correctly
                const w = item.offsetWidth || parseFloat(item.style.width) || 300;
                const h = item.offsetHeight || parseFloat(item.style.height) || 200;

                // Wrap to next row if item doesn't fit (but always place at least one per row)
                if (currentX > padding && currentX + w > containerWidth - padding) {
                    currentX = padding;
                    currentY += rowHeight + gap;
                    rowHeight = 0;
                }

                item.style.left = `${currentX}px`;
                item.style.top = `${currentY}px`;

                currentX += w + gap;
                if (h > rowHeight) rowHeight = h;
            });

            // Expand board to fit all content, keep width at viewport
            board.style.width = `${Math.max(3000, containerWidth)}px`;
            board.style.height = `${Math.max(3000, currentY + rowHeight + 100)}px`;

            // Scroll to top-left so user sees the arranged items
            container.scrollTo({ top: 0, left: 0, behavior: 'smooth' });

            setTimeout(() => {
                items.forEach(item => {
                    item.style.transition = 'box-shadow 0.2s, transform 0.2s';
                });
                showToast('Arrangement complete');
            }, 650);
        }

        // --- Collect Item State ---
        function collectItemStates() {
            return items.map(el => {
                const type = el.dataset.itemType;
                const id = el.dataset.itemId;
                const state = {
                    type,
                    itemId: id,
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width,
                    height: el.style.height,
                    minHeight: el.style.minHeight || '',
                    aspect: el.dataset.aspect || '',
                    freeResize: el.dataset.freeResize || '',
                    zIndex: el.style.zIndex || '',
                };
                if (type === 'image') {
                    const entry = mediaSources.get(id);
                    state.src = entry ? entry.src : null;
                    state.fileName = entry ? entry.fileName : null;
                }
                if (type === 'video') {
                    const entry = mediaSources.get(id);
                    state.src = entry ? entry.src : null;
                    state.fileName = entry ? entry.fileName : null;
                    const vid = el.querySelector('video');
                    state.loop = vid ? vid.loop : false;
                }
                if (type === 'youtube') state.ytid = el.dataset.ytid;
                if (type === 'note') {
                    state.noteHeader = el.dataset.noteHeader || '';
                    state.noteBody = el.dataset.noteBody || '';
                    state.noteHeaderSize = el.dataset.noteHeaderSize || '24px';
                    state.noteBodySize = el.dataset.noteBodySize || '15px';
                }
                return state;
            });
        }

        // --- Export HTML (static, view-only) ---
        function saveBoard() {
            showToast('Generating export...');
            setTimeout(() => {
                try {
                    const states = collectItemStates();

                    const htmlHeader = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Moodboard</title>
<style>
:root{--bg-color:#f5f5dc;--dot-color:#dcdcdc;--item-shadow:0 4px 10px rgba(0,0,0,0.15);}
*{box-sizing:border-box;}
body,html{margin:0;padding:0;width:100%;height:100%;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background-color:var(--bg-color);background-image:radial-gradient(var(--dot-color) 1.5px,transparent 1.5px);background-size:20px 20px;}
#board-container{width:100vw;height:100vh;overflow:auto;}
#board{width:3000px;height:3000px;position:relative;}
a{color:#1a6fc4;text-decoration:underline;}a:hover{color:#0d4a8a;}
.watermark{position:fixed;bottom:10px;right:10px;font-family:sans-serif;color:rgba(0,0,0,0.3);font-size:12px;pointer-events:none;}
</style>
</head>
<body>
<div id="board-container"><div id="board">`;

                    const htmlFooter = `</div></div>
<div class="watermark">Created with Moodboard Tool</div>
</body></html>`;

                    // Build Blob parts array — each item is its own chunk, never one giant string
                    const blobParts = [htmlHeader];

                    states.forEach(s => {
                        const pos = `left:${s.left};top:${s.top};width:${s.width};height:${s.height};${s.minHeight ? 'min-height:' + s.minHeight + ';' : ''}position:absolute;border-radius:4px;box-shadow:var(--item-shadow);background:white;`;
                        let inner = '';

                        if (s.type === 'image') {
                            // src pushed as its own Blob part — no string concat with data URL
                            blobParts.push(`<div style="${pos}"><img src="`);
                            blobParts.push(s.src || '');
                            blobParts.push(`" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;"></div>\n`);
                            return;
                        } else if (s.type === 'video') {
                            blobParts.push(`<div style="${pos}"><video src="`);
                            blobParts.push(s.src || '');
                            blobParts.push(`" controls${s.loop ? ' loop' : ''} style="display:block;width:100%;height:100%;object-fit:contain;background:#000;border-radius:2px;"></video></div>\n`);
                            return;
                        } else if (s.type === 'youtube') {
                            inner = `<iframe src="https://www.youtube.com/embed/${s.ytid}?autoplay=0&controls=1" frameborder="0" allowfullscreen style="display:block;width:100%;height:100%;border-radius:2px;"></iframe>`;
                        } else if (s.type === 'note') {
                            const hPart = s.noteHeader ? `<p style="font-weight:700;font-size:${s.noteHeaderSize};color:#1a1a1a;margin:0 0 8px 0;word-break:break-word;">${escapeHtml(s.noteHeader)}</p>` : '';
                            const bPart = s.noteBody ? `<p style="font-size:${s.noteBodySize};color:#444;margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.55;">${parseNoteBodyForExport(s.noteBody)}</p>` : '';
                            inner = `<div style="padding:16px 18px;box-sizing:border-box;">${hPart}${bPart}</div>`;
                        }

                        blobParts.push(`<div style="${pos}">${inner}</div>\n`);
                    });

                    blobParts.push(htmlFooter);

                    // Blob constructor handles array parts natively — no giant string ever built
                    const blob = new Blob(blobParts, { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'my-moodboard.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    showToast('Exported!');
                } catch(err) {
                    console.error('Export error:', err);
                    showToast('Export failed: ' + (err.message || err));
                }
            }, 50);
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // --- Save Project (layout only — no media data embedded) ---
        function saveProject() {
            const states = collectItemStates();
            // Strip all src data — only keep filename references for local media
            const lightStates = states.map(s => {
                const out = Object.assign({}, s);
                delete out.src; // never save data URLs — they crash the browser
                return out;
            });
            const payload = JSON.stringify({
                version: 2,
                boardWidth: board.style.width,
                boardHeight: board.style.height,
                items: lightStates
            }, null, 0);
            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my-moodboard.moodboard';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
            showToast('Project saved!');
        }

        // --- Load Project ---
        const projectInput = document.getElementById('projectInput');
        projectInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const state = JSON.parse(ev.target.result);
                    if (confirm('Loading a project will replace the current board. Continue?')) {
                        board.innerHTML = '';
                        items = [];
                        mediaSources.clear();
                        zIndexCounter = 10;
                        restoreItemStates(state.items);
                        if (state.boardWidth) board.style.width = state.boardWidth;
                        if (state.boardHeight) board.style.height = state.boardHeight;
                        showToast('Project loaded!');
                        updateRelinkButton();
                    }
                } catch(err) {
                    alert('Could not read project file. Is it a valid .moodboard file?');
                }
            };
            reader.readAsText(file);
            projectInput.value = '';
        });

        function restoreItemStates(states) {
            states.forEach(s => {
                if (s.type === 'image' || s.type === 'video') {
                    createPlaceholderItem(s.type, s.fileName || 'unknown file', s);
                } else if (s.type === 'youtube') {
                    createBoardItem('youtube', s.ytid);
                    applyItemGeometry(items[items.length - 1], s);
                } else if (s.type === 'note') {
                    createNoteItem(s.noteHeader, s.noteBody, s.noteHeaderSize, s.noteBodySize);
                    applyItemGeometry(items[items.length - 1], s);
                }
            });

            // Auto-relink via stored FileSystemFileHandles (Chrome/Edge only)
            const placeholders = items.filter(el => el.dataset.missingMedia === 'true');
            if (placeholders.length === 0) return;

            if (HAS_PICKER) {
                showToast('Restoring media…');
                let restored = 0;
                let done = 0;
                placeholders.forEach(async (el) => {
                    const ok = await autoRelinkFromHandle(el);
                    if (ok) restored++;
                    done++;
                    if (done === placeholders.length) {
                        const still = items.filter(el => el.dataset.missingMedia === 'true').length;
                        updateRelinkButton();
                        if (still === 0) showToast('All media restored!');
                        else showToast(`${restored} restored · ${still} need re-linking`);
                    }
                });
            } else {
                updateRelinkButton();
            }
        }

        // Try to restore one placeholder using its stored FileSystemFileHandle
        async function autoRelinkFromHandle(el) {
            const itemId = el.dataset.itemId;
            if (!itemId) return false;
            try {
                const record = await dbGetHandle(itemId);
                if (!record || !record.handle) return false;

                // Query then request read permission (browser may prompt user once)
                let perm = await record.handle.queryPermission({ mode: 'read' });
                if (perm !== 'granted') perm = await record.handle.requestPermission({ mode: 'read' });
                if (perm !== 'granted') return false;

                const file = await record.handle.getFile();
                const src = await readFileAsDataURL(file);
                restoreMediaToPlaceholder(el, src, el.dataset.itemType, record.fileName);
                return true;
            } catch(e) {
                console.warn('Auto-relink failed for', itemId, e);
                return false;
            }
        }

        // Shared: swap a placeholder element's content for real media
        function restoreMediaToPlaceholder(el, src, type, fileName) {
            const itemId = el.dataset.itemId;
            mediaSources.set(itemId, { src, fileName });
            el.querySelector('.missing-media')?.remove();
            delete el.dataset.missingMedia;

            let media;
            if (type === 'image') {
                media = document.createElement('img');
                media.src = src;
                media.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;';
                media.onload = function() { el.dataset.aspect = this.naturalWidth / this.naturalHeight; };
            } else {
                media = document.createElement('video');
                media.src = src;
                media.controls = true;
                media.loop = el.dataset.pendingLoop === 'true';
                media.style.cssText = 'display:block;width:100%;height:100%;object-fit:contain;background:#000;border-radius:2px;';
                media.onloadedmetadata = function() { el.dataset.aspect = this.videoWidth / this.videoHeight; };
                media.addEventListener('contextmenu', (ev) => showVideoCtxMenu(ev, media));
                const overlay = document.createElement('div');
                overlay.className = 'video-drag-overlay';
                overlay.addEventListener('contextmenu', (ev) => showVideoCtxMenu(ev, media));
                el.appendChild(overlay);
            }
            el.insertBefore(media, el.querySelector('.item-controls'));
            delete el.dataset.pendingLoop;
        }

        // Create a grey placeholder card for a local file that isn't loaded yet
        function createPlaceholderItem(type, fileName, savedState) {
            const el = document.createElement('div');
            el.classList.add('board-item');
            el.dataset.itemType = type;
            // Reuse the saved itemId so IndexedDB handle lookup succeeds
            const itemId = savedState.itemId || ('item-' + (itemIdCounter++));
            el.dataset.itemId = itemId;
            el.dataset.fileName = fileName;
            el.dataset.missingMedia = 'true';
            if (savedState.loop) el.dataset.pendingLoop = 'true';

            el.style.left = savedState.left || '20px';
            el.style.top = savedState.top || '20px';
            el.style.width = savedState.width || '280px';
            el.style.height = savedState.height || '200px';
            el.style.zIndex = savedState.zIndex || (zIndexCounter++);

            const ph = document.createElement('div');
            ph.className = 'missing-media';
            ph.innerHTML = `
                <div class="mi-icon">${type === 'video' ? '🎬' : '🖼️'}</div>
                <div class="mi-name">${escapeHtml(fileName)}</div>
                <div class="mi-hint">${HAS_PICKER ? 'Restoring…' : 'Click "Re-link Files" to restore'}</div>`;
            el.appendChild(ph);

            const controls = document.createElement('div');
            controls.className = 'item-controls';
            const delBtn = document.createElement('div');
            delBtn.className = 'ctrl-btn delete';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = (e) => { e.stopPropagation(); removeItem(el); updateRelinkButton(); };
            controls.appendChild(delBtn);
            el.appendChild(controls);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            el.appendChild(resizeHandle);

            el.addEventListener('mousedown', onMouseDown);
            resizeHandle.addEventListener('mousedown', onResizeStart);
            el.addEventListener('touchstart', onTouchStart, { passive: false });

            board.appendChild(el);
            items.push(el);
        }

        // Re-link files button visibility
        function updateRelinkButton() {
            const hasMissing = items.some(el => el.dataset.missingMedia === 'true');
            document.getElementById('relink-btn').style.display = hasMissing ? 'inline-flex' : 'none';
        }

        // Re-link: manual fallback — user picks files, matched by filename
        const relinkInput = document.getElementById('relinkInput');
        relinkInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const fileMap = new Map();
            files.forEach(f => fileMap.set(f.name, f));

            const missingItems = items.filter(el => el.dataset.missingMedia === 'true');
            let matched = 0;

            for (const el of missingItems) {
                const needed = el.dataset.fileName;
                const file = fileMap.get(needed);
                if (!file) continue;
                const src = await readFileAsDataURL(file);
                restoreMediaToPlaceholder(el, src, el.dataset.itemType, needed);
                matched++;
                updateRelinkButton();
            }

            const stillMissing = items.filter(el => el.dataset.missingMedia === 'true').length;
            showToast(stillMissing > 0 ? `${matched} linked · ${stillMissing} still missing` : 'All files re-linked!');
            relinkInput.value = '';
        });

        function applyItemGeometry(el, s) {
            el.style.left = s.left;
            el.style.top = s.top;
            if (s.width) el.style.width = s.width;
            if (s.height && s.height !== 'auto') el.style.height = s.height;
            if (s.minHeight) el.style.minHeight = s.minHeight;
            if (s.zIndex) el.style.zIndex = s.zIndex;
        }

        function downloadText(content, filename, mimeType) {
            const blob = new Blob([content], {type: mimeType});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.opacity = '1';
            setTimeout(() => toastEl.style.opacity = '0', 2000);
        }
    </script>
</body>
</html>
